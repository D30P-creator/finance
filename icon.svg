<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131c"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#6fa8ff"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1fb8c9"/><stop offset="1" stop-color="#54e6dd"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1fc46e"/><stop offset="1" stop-color="#5cf0a0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- frosted glass panel -->
  <rect x="92" y="92" width="328" height="328" rx="80" fill="url(#panel)"
        stroke="#ffffff" stroke-opacity="0.32" stroke-width="2"/>
  <!-- single soft top highlight -->
  <path d="M110 170 Q150 116 256 112 L256 150 Q160 156 130 220 Z" fill="#ffffff" opacity="0.14"/>

  <!-- glow behind bars -->
  <g filter="url(#glow)" opacity="0.5">
    <rect x="150" y="270" width="62" height="100" rx="22" fill="#3b82f6"/>
    <rect x="225" y="220" width="62" height="150" rx="22" fill="#1fb8c9"/>
    <rect x="300" y="160" width="62" height="210" rx="22" fill="#1fc46e"/>
  </g>

  <!-- three bold ascending bars -->
  <rect x="150" y="270" width="62" height="100" rx="22" fill="url(#bar1)"/>
  <rect x="225" y="220" width="62" height="150" rx="22" fill="url(#bar2)"/>
  <rect x="300" y="160" width="62" height="210" rx="22" fill="url(#bar3)"/>
</svg>
