<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262a33"/>
      <stop offset="0.55" stop-color="#14161c"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9dff"/>
      <stop offset="0.55" stop-color="#3fd0c9"/>
      <stop offset="1" stop-color="#5cf0a0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- premium squircle background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <!-- soft top sheen for depth -->
  <rect x="28" y="24" width="456" height="240" rx="104" fill="url(#sheen)"/>

  <!-- single dominant element: clean growth arrow -->
  <g filter="url(#sh)" fill="none" stroke="url(#mark)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 348 L232 266 L300 320 L372 196"/>
    <path d="M330 182 L388 174 L380 232"/>
  </g>
</svg>
