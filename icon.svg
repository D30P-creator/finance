<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#7fb0ff"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1fb8c9"/><stop offset="1" stop-color="#5ee8de"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1fc46e"/><stop offset="1" stop-color="#6cf4a6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
      <feGaussianBlur stdDeviation="0"/>
    </filter>
  </defs>

  <!-- solo le barre di vetro, sfondo trasparente -->
  <g filter="url(#glow)">
    <!-- bar 1 -->
    <rect x="118" y="288" width="78" height="132" rx="26" fill="url(#bar1)"/>
    <rect x="132" y="300" width="20" height="108" rx="10" fill="url(#sheen)"/>
    <!-- bar 2 -->
    <rect x="217" y="222" width="78" height="198" rx="26" fill="url(#bar2)"/>
    <rect x="231" y="234" width="20" height="174" rx="10" fill="url(#sheen)"/>
    <!-- bar 3 -->
    <rect x="316" y="140" width="78" height="280" rx="26" fill="url(#bar3)"/>
    <rect x="330" y="152" width="20" height="256" rx="10" fill="url(#sheen)"/>
  </g>
</svg>
